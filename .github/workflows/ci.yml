name: OptiSight CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-engine:
    name: Lint, Type Check, Unit Tests & Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system libs (Ubuntu headless OpenCV/Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3

      - name: Install package & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Code Formatting Check (Black)
        run: |
          python -m black --check core reports cli ui main.py saliency_engine.py saliency_metrics.py tests

      - name: Lint Check (Ruff)
        run: |
          python -m ruff check core reports cli ui main.py saliency_engine.py saliency_metrics.py tests

      - name: Static Type Check (Mypy)
        run: |
          python -m mypy core reports cli main.py saliency_engine.py saliency_metrics.py

      - name: Run Unit, Regression & CLI Smoke Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify `optisight --benchmark` Console Command
        run: |
          optisight --benchmark

  build-windows-exe:
    name: Build Portable Windows EXE
    needs: test-engine
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Build single-file portable OptiSight.exe
        run: |
          pyinstaller --noconfirm --onefile --name "OptiSight" --hidden-import "ui.app" --exclude-module torch --exclude-module tensorflow --exclude-module tensorboard --add-data "assets;assets" --clean main.py

      - name: Upload OptiSight.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiSight-Windows-Portable-EXE
          path: dist/OptiSight.exe

      - name: Publish to GitHub Releases on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OptiSight.exe
          generate_release_notes: true
